# nginx site config for a single-VPS deployment.
#
# Install to /etc/nginx/sites-available/ott and symlink into sites-enabled,
# then run `certbot --nginx -d example.com` to fill in the TLS block.
#
# Note what does NOT pass through here: video. Clients fetch manifests and
# segments straight from Flussonic, so this box never carries stream bandwidth
# and stays sized for API traffic alone.

upstream ott_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

upstream ott_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Redirect plain HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    # certbot fills these in.
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Artwork uploads are ~8 MB at most; everything else is small JSON.
    client_max_body_size 10M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://ott_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The API binds Flussonic tokens to the viewer's IP, so this header has
        # to be accurate — `trust proxy` in main.ts reads it.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }

    location = /healthz { proxy_pass http://ott_api/healthz; access_log off; }
    location = /readyz  { proxy_pass http://ott_api/readyz;  access_log off; }

    # Uploaded artwork, served from disk rather than through Node.
    # When STORAGE_DRIVER moves to s3, point PUBLIC_ASSET_BASE_URL at the bucket
    # or CDN and this block becomes unnecessary.
    location /uploads/ {
        alias /srv/ott/apps/api/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /_next/static/ {
        proxy_pass http://ott_web;
        proxy_cache_valid 200 60m;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://ott_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
